<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FoodBridge</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">

    <!-- Global Styles -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/header.css">

    <!-- Page Specific Styles -->
    <link rel="stylesheet" href="certificates.css">
</head>

<body>
    <div class="noise-bg"></div>
    <header class="dashboard-header">
        <a href="dashboard.html" class="navbar-brand">
            <div class="navbar-logo">
                <img src="../../assets/images/logo.png" alt="Logo" />
            </div>
        </a>

        <div class="nav-overlay" id="navOverlay">
            <nav class="dashboard-nav">
                <a href="dashboard.html" class="dashboard-nav-item">Overview</a>
                <a href="users.html" class="dashboard-nav-item">Users</a>
                <a href="vouchers.html" class="dashboard-nav-item">Vouchers</a>
                <a href="donations.html" class="dashboard-nav-item">Donations</a>
                <a href="trust-rules.html" class="dashboard-nav-item">Trust Rules</a>
                <a href="reports.html" class="dashboard-nav-item">Reports</a>
                <a href="certificates.html" class="dashboard-nav-item active">Certificates</a>
            </nav>
        </div>

        <div class="dashboard-actions">
            <a class="action-btn-circle hide-mobile" title="Notifications" style="position: relative;"
                href="notifications.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
                </svg>
                <span
                    style="position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; background-color: #ff4757; border-radius: 50%;"></span>
            </a>

            <a href="profile.html" class="profile-avatar">DO</a>

            <a href="../../auth/login.html" class="action-btn-circle hide-mobile" title="Log Out">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>

            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle mobile menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="dashboard-wrapper">
        <main class="dashboard-content certificates-page">

            <section class="certificates-hero">
                <div class="hero-header-flex">
                    <div>
                        <h1 class="page-heading">Certificates of Impact</h1>
                        <p class="page-subheading">Manage, create, and revoke corporate social responsibility (CSR)
                            certificates for donors.</p>
                    </div>
                    <button class="btn-create-trigger" id="openModalBtn" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Create Certificate
                    </button>
                </div>
            </section>

            <section class="certificates-grid" id="certificatesContainer" aria-label="Available Certificates"></section>

        </main>
    </div>

    <div class="modal-overlay" id="certModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Create New Certificate</h2>
                <button class="modal-close-btn" id="closeModalBtn" type="button">&times;</button>
            </div>
            <form id="createCertificateForm">
                <div class="form-group">
                    <label for="certDonorSelect">Select Recipient Donor</label>
                    <select id="certDonorSelect" required>
                        <option value="" disabled selected>-- Choose a Registered Donor --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="certTitle">Certificate Title</label>
                    <input type="text" id="certTitle" placeholder="e.g., Food Hero Q1 2026" required />
                </div>

                <div class="form-group">
                    <label for="certPeriod">Timeline Period</label>
                    <input type="text" id="certPeriod" placeholder="e.g., Jan 2026 – Mar 2026" required />
                </div>

                <div class="form-row-split">
                    <div class="form-group">
                        <label for="certDonations">Donation Count</label>
                        <input type="number" id="certDonations" placeholder="0" readonly />
                    </div>
                    <div class="form-group">
                        <label for="certRating">Satisfaction Score</label>
                        <input type="number" id="certRating" placeholder="0.0" readonly />
                    </div>
                </div>

                <button type="submit" class="btn-submit-action">Generate & Create</button>
            </form>
        </div>
    </div>

    <!-- Page Specific Logic -->
    <script src="../../assets/js/header.js"></script>
    <script src="certificates.js"></script>

</body>

</html>
